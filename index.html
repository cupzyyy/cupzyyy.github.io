        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@700;800;900&display=swap');

        :root {
            --ios-red: #FF3B30;
            --ios-dark-bg: #000000;
            --ios-card-bg: rgba(28, 28, 30, 0.8);
        }

        body {
            background-color: var(--ios-dark-bg);
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Inter", sans-serif;
            color: white;
            overflow-x: hidden;
            -webkit-font-smoothing: antialiased;
        }

        .btn-ios {
            transition: transform 0.2s cubic-bezier(0.33, 1, 0.68, 1), background-color 0.2s linear;
        }

        .btn-ios:active {
            transform: scale(0.96);
            background-color: rgba(255, 59, 48, 0.3) !important;
        }

        @keyframes iosEntrance {
            from { opacity: 0; transform: translateY(30px) scale(0.95); }
            to { opacity: 1; transform: translateY(0) scale(1); }
        }

        .animate-ios {
            animation: iosEntrance 0.8s cubic-bezier(0.16, 1, 0.3, 1) forwards;
            opacity: 0;
        }

        .delay-1 { animation-delay: 0.1s; }
        .delay-2 { animation-delay: 0.2s; }
        .delay-3 { animation-delay: 0.3s; }
        .delay-4 { animation-delay: 0.4s; }
        .delay-5 { animation-delay: 0.5s; }

        /* SVG icon styling */
        .icon-svg {
            width: 24px;
            height: 24px;
            stroke: white;
            stroke-width: 1.8;
            fill: none;
        }
        
        .icon-bg {
            width: 44px;
            height: 44px;
            background: rgba(255,255,255,0.15);
            border-radius: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
    </style>
</head>
